[package]
name = "tfhe-math"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[[test]]
name = "width_policy"
path = "tests/width_policy.rs"

[[test]]
name = "public_arithmetic"
path = "tests/public_arithmetic.rs"

[[test]]
name = "native"
path = "tests/native.rs"
required-features = ["tfhe-backend"]

[features]
default = ["tfhe-backend"]
tfhe-backend = ["dep:tfhe", "dep:serde", "dep:bincode"]

[dependencies]
tfhe = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
