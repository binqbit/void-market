[workspace]
resolver = "3"
members = [
    "crates/tfhe-math",
    "crates/private-check",
    "crates/arbiter-protocol",
    "apps/market",
    "apps/arbiter",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
tfhe = { version = "=1.8.2", default-features = false, features = ["integer"] }
sha2 = "=0.10.9"
thiserror = "=2.0.18"
serde = "=1.0.228"
bincode = "=1.3.3"
rand = { version = "=0.9.2", default-features = false, features = ["std", "os_rng"] }
zeroize = "=1.8.2"
minicbor = { version = "=0.26.5", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
opt-level = 2
debug = 0

[profile.dev.package.tfhe]
opt-level = 3

[profile.dev.package.tfhe-fft]
opt-level = 3

[profile.dev.package.tfhe-ntt]
opt-level = 3
