# Combine with compose.yaml, compose.arbiter.yaml, and compose.custody.yaml.
x-localnet: &localnet
  image: void-market-localnet:local
  build:
    context: .
    dockerfile: docker/localnet/Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  init: true
  volumes:
    - ${LOCALNET_STATE_DIR:?Set the private localnet state directory}:/var/lib/localnet
  environment:
    ZCASH_NODE_RPC_URL: http://zebra:18232
    ZCASH_WALLET_RPC_URL: http://zallet:28232
  networks:
    - backend
  restart: unless-stopped
  stop_grace_period: 120s

x-chain-env: &chain-env
  DEMO_MODE: "true"
  ETHEREUM_RPC_URL: http://anvil:8545
  ZCASH_NODE_RPC_URL: http://zebra:18232
  ZCASH_WALLET_RPC_URL: http://zallet:28232
  ZCASH_WALLET_COOKIE_FILE: /var/lib/localnet/wallet/.cookie

services:
  anvil:
    <<: *localnet
    command: ["anvil", "--host", "0.0.0.0"]
    ports:
      - 127.0.0.1:${ETHEREUM_RPC_PORT:-8545}:8545
  zebra:
    <<: *localnet
    command: ["zebra", "--host", "0.0.0.0"]
    ports:
      - 127.0.0.1:${ZCASH_RPC_PORT:-18232}:18232
  zallet:
    <<: *localnet
    command: ["wallet", "--host", "0.0.0.0"]
    depends_on:
      zebra:
        condition: service_started
  localnet-miner:
    <<: *localnet
    command: ["miner"]
    depends_on:
      zebra:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "/opt/localnet/node.py", "mining-health"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
  localnet-faucet:
    <<: *localnet
    command: ["faucet"]
    depends_on:
      zallet:
        condition: service_started
      localnet-miner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/opt/localnet/node.py", "health"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
  api:
    image: void-market-demo:local
    build:
      args:
        DEMO_MODE: "true"
    environment:
      <<: *chain-env
    volumes:
      - ${LOCALNET_STATE_DIR}:/var/lib/localnet:ro
    depends_on:
      localnet-miner:
        condition: service_healthy
      localnet-faucet:
        condition: service_healthy
  worker:
    image: void-market-demo:local
    build:
      args:
        DEMO_MODE: "true"
    environment:
      <<: *chain-env
    volumes:
      - ${LOCALNET_STATE_DIR}:/var/lib/localnet:ro
    depends_on:
      localnet-miner:
        condition: service_healthy
      localnet-faucet:
        condition: service_healthy
  migrate:
    image: void-market-demo:local
    build:
      args:
        DEMO_MODE: "true"
    environment:
      <<: *chain-env
    volumes:
      - ${LOCALNET_STATE_DIR}:/var/lib/localnet:ro
  arbiter:
    image: void-market-arbiter-demo:local
    build:
      args:
        DEMO_MODE: "true"
  arbiter-migrate:
    image: void-market-arbiter-demo:local
    build:
      args:
        DEMO_MODE: "true"
