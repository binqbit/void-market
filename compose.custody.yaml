# Optional DEVELOPMENT custody; combine with compose.yaml and compose.arbiter.yaml.
# User keys are encrypted by the market. Only check artifacts share the node volume.
x-custody: &custody
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    DEV_CUSTODY: "true"
    CUSTODY_MASTER_KEY_FILE: /run/secrets/custody_master_key
    CUSTODY_ARTIFACT_ROOT: /var/lib/market/checks
  secrets:
    - source: custody_master_key
      uid: "${LOCAL_UID:-1000}"
      gid: "${LOCAL_GID:-1000}"
      mode: 0400
  volumes:
    - ${DEV_MEDIA_ROOT:?Set the intended development media directory}:/var/lib/market/media
    - ${ARBITER_ARTIFACT_ROOT:?Set the shared check artifact directory}:/var/lib/market/checks
  mem_limit: 4g
  cpus: 2
  stop_grace_period: 120s

services:
  api:
    <<: *custody
  worker:
    <<: *custody
  migrate:
    <<: *custody

secrets:
  custody_master_key:
    file: ${CUSTODY_MASTER_KEY_FILE:?Set the private 32-byte custody master-key file}
