[package]
name = "arbiter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
check-workflow = { path = "../../crates/check-workflow" }
arbiter-protocol = { path = "../../crates/arbiter-protocol" }
private-check = { path = "../../crates/private-check" }
tfhe-math = { path = "../../crates/tfhe-math" }
actix-web = { version = "=4.18.1", default-features = false, features = ["macros"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "derive", "migrate", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "=1.0.145"
url = "=2.5.7"
uuid = { version = "=1.19.0", features = ["v4", "serde"] }
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
thiserror.workspace = true
base64 = "=0.22.1"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json"] }
tracing = "=0.1.43"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }

[lints]
workspace = true

[dev-dependencies]
market = { path = "../market" }
