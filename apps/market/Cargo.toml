[package]
name = "market"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
check-workflow = { path = "../../crates/check-workflow" }
tfhe-math = { path = "../../crates/tfhe-math" }
private-check = { path = "../../crates/private-check" }
zeroize.workspace = true
ring = "=0.17.14"
minicbor.workspace = true
arbiter-protocol = { path = "../../crates/arbiter-protocol" }
actix-web = { version = "=4.18.1", default-features = false, features = ["macros", "cookies"] }
actix-multipart = { version = "=0.8.5", default-features = false }
actix-cors = "=0.7.2"
futures-util = "=0.3.34"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "json", "derive", "migrate", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
hex = "=0.4.3"
sha3 = "=0.10.9"
uuid = { version = "=1.19.0", features = ["v4", "serde"] }
sha2.workspace = true
rand.workspace = true
webauthn-rs = "=0.5.5"
url = "=2.5.7"
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio"] }
tracing = "=0.1.43"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "=0.22.1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }

[lints]
workspace = true
