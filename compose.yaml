# Local development: internal asset ownership; no RPC or HE services.
x-service: &service
  image: void-market:local
  build:
    context: .
    dockerfile: docker/market/Dockerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp
  secrets:
    - database_password
    - jwt_secret
  environment:
    LISTEN: 0.0.0.0:8080
    ORIGIN: ${ORIGIN:-http://localhost:3000}
    RP_ID: ${RP_ID:-localhost}
    DATABASE_HOST: db
    DATABASE_PORT: "5432"
    DATABASE_NAME: market
    DATABASE_USER: market
    DATABASE_PASSWORD_FILE: /run/secrets/database_password
    KAFKA_BROKERS: kafka:9092
    EVENT_TOPIC: ${EVENT_TOPIC:-dev.voidmarket.assets.events.v1}
    MEDIA_ROOT: /var/lib/market/media
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    RUST_LOG: info
  volumes:
    - media_data:/var/lib/market/media
  stop_grace_period: 30s
  networks:
    - backend

services:
  web:
    image: void-market-web:local
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:8080
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  kafka:
    image: void-market-kafka:local
    build:
      context: docker/kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set a persistent local Kafka cluster ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - localhost:9092
        - --list
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - backend

  kafka-init:
    image: void-market-kafka:local
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - ${EVENT_TOPIC:-dev.voidmarket.assets.events.v1}
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    restart: "no"
    networks:
      - backend

  migrate:
    <<: *service
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *service
    command: ["serve"]
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/market", "healthcheck", "api"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *service
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/market", "healthcheck", "worker"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

secrets:
  database_password:
    environment: DATABASE_PASSWORD
  jwt_secret:
    environment: JWT_SECRET

volumes:
  postgres_data:
  kafka_data:
  media_data:

networks:
  backend:
